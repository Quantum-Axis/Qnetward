services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - netwatcher
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.frontend-primary.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: netwatcher-frontend:production
    restart: unless-stopped
    depends_on:
      - netwatcher
    environment:
      NETWATCHER_BACKEND_URL: http://netwatcher:8080

  netwatcher:
    build:
      context: ..
      dockerfile: Dockerfile
    image: netwatcher:production
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
      - objectstore
    environment:
      NETWATCHER_LISTEN: 0.0.0.0:8080
      NETWATCHER_DB_DSN: postgres://netwatcher:${POSTGRES_PASSWORD}@timescaledb:5432/netwatcher?sslmode=disable
      NETWATCHER_TIMESCALE: "true"
      NETWATCHER_DB_BATCH: "250"
      NETWATCHER_DB_FLUSH: 1s
      NETWATCHER_DB_RETENTION: 720h
      NETWATCHER_DB_CLEANUP: 1h
      NETWATCHER_DB_MAX_OPEN: "25"
      NETWATCHER_DB_MAX_IDLE: "10"
      NETWATCHER_DB_CONN_MAX_LIFETIME: 30m
      NETWATCHER_REDIS_ADDR: redis:6379
      NETWATCHER_REDIS_DB: "0"
      NETWATCHER_REDIS_PREFIX: netwatcher
      NETWATCHER_REDIS_CACHE_TTL: 3s
      NETWATCHER_S3_ENDPOINT: objectstore:8333
      NETWATCHER_S3_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY}
      NETWATCHER_S3_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY}
      NETWATCHER_S3_BUCKET: netwatcher-artifacts
      NETWATCHER_S3_REGION: us-east-1
      NETWATCHER_S3_PREFIX: production
      NETWATCHER_S3_SSL: "false"
      NETWATCHER_PUBLIC_BASE_URL: ${NETWATCHER_PUBLIC_BASE_URL}
      NETWATCHER_ALLOWED_ORIGINS: ${NETWATCHER_ALLOWED_ORIGINS}
      NETWATCHER_DEMO_ENABLED: ${NETWATCHER_DEMO_ENABLED}
      NETWATCHER_DEMO_NAME: ${NETWATCHER_DEMO_NAME}
      NETWATCHER_DEMO_EMAIL: ${NETWATCHER_DEMO_EMAIL}
      NETWATCHER_RESEND_API_KEY: ${NETWATCHER_RESEND_API_KEY}
      NETWATCHER_EMAIL_FROM: ${NETWATCHER_EMAIL_FROM}
      NETWATCHER_EMAIL_REPLY_TO: ${NETWATCHER_EMAIL_REPLY_TO}
    cap_add:
      - NET_RAW

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: netwatcher
      POSTGRES_USER: netwatcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # S3-compatible object storage for exported history artifacts. MinIO's
  # container images were pulled from both Docker Hub and quay.io in
  # September 2026 after the project archived its community edition and
  # went source-only (see docs/adr/0007-replace-minio-with-seaweedfs.md),
  # so this uses SeaweedFS's S3 gateway instead. `weed mini` is a single
  # all-in-one process (master+volume+filer+S3), the same role MinIO's
  # single `server` command played here; AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY seed static S3 credentials the same way
  # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD used to.
  objectstore:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECTSTORE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECTSTORE_SECRET_KEY}
      S3_BUCKET: netwatcher-artifacts
    ports:
      - "8333:8333"
    volumes:
      - objectstore-data:/data

volumes:
  timescaledb-data:
  redis-data:
  objectstore-data:
