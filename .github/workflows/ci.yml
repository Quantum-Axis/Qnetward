name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: qnetward
          POSTGRES_PASSWORD: qnetward
          POSTGRES_DB: qnetward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qnetward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QNETWARD_TEST_POSTGRES_DSN: postgres://qnetward:qnetward@127.0.0.1:5432/qnetward_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      # -p 1: packages share the users and sessions tables.
      - name: Go test (race)
        run: go test -race -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
