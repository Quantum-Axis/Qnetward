services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - qnetward
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.frontend-primary.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: qnetward-frontend:production
    restart: unless-stopped
    depends_on:
      - qnetward
    environment:
      QNETWARD_BACKEND_URL: http://qnetward:8080

  qnetward:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qnetward:production
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
      - minio
    environment:
      QNETWARD_LISTEN: 0.0.0.0:8080
      QNETWARD_DB_DSN: postgres://netwatcher:${POSTGRES_PASSWORD}@timescaledb:5432/netwatcher?sslmode=disable
      QNETWARD_TIMESCALE: "true"
      QNETWARD_DB_BATCH: "250"
      QNETWARD_DB_FLUSH: 1s
      QNETWARD_DB_RETENTION: 720h
      QNETWARD_DB_CLEANUP: 1h
      QNETWARD_DB_MAX_OPEN: "25"
      QNETWARD_DB_MAX_IDLE: "10"
      QNETWARD_DB_CONN_MAX_LIFETIME: 30m
      QNETWARD_REDIS_ADDR: redis:6379
      QNETWARD_REDIS_DB: "0"
      QNETWARD_REDIS_PREFIX: qnetward
      QNETWARD_REDIS_CACHE_TTL: 3s
      QNETWARD_S3_ENDPOINT: minio:9000
      QNETWARD_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      QNETWARD_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QNETWARD_S3_BUCKET: netwatcher-artifacts
      QNETWARD_S3_REGION: us-east-1
      QNETWARD_S3_PREFIX: production
      QNETWARD_S3_SSL: "false"
      QNETWARD_PUBLIC_BASE_URL: ${QNETWARD_PUBLIC_BASE_URL:-${NETWATCHER_PUBLIC_BASE_URL:-}}
      QNETWARD_ALLOWED_ORIGINS: ${QNETWARD_ALLOWED_ORIGINS:-${NETWATCHER_ALLOWED_ORIGINS:-}}
      QNETWARD_DEMO_ENABLED: ${QNETWARD_DEMO_ENABLED:-${NETWATCHER_DEMO_ENABLED:-}}
      QNETWARD_DEMO_NAME: ${QNETWARD_DEMO_NAME:-${NETWATCHER_DEMO_NAME:-}}
      QNETWARD_DEMO_EMAIL: ${QNETWARD_DEMO_EMAIL:-${NETWATCHER_DEMO_EMAIL:-}}
      QNETWARD_ADMIN_EMAILS: ${QNETWARD_ADMIN_EMAILS:-${NETWATCHER_ADMIN_EMAILS:-}}
      QNETWARD_RESEND_API_KEY: ${QNETWARD_RESEND_API_KEY:-${NETWATCHER_RESEND_API_KEY:-}}
      QNETWARD_EMAIL_FROM: ${QNETWARD_EMAIL_FROM:-${NETWATCHER_EMAIL_FROM:-}}
      QNETWARD_EMAIL_REPLY_TO: ${QNETWARD_EMAIL_REPLY_TO:-${NETWATCHER_EMAIL_REPLY_TO:-}}
    cap_add:
      - NET_RAW

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: netwatcher
      POSTGRES_USER: netwatcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  timescaledb-data:
  redis-data:
  minio-data:
